services:
  stackhost:
    build: .
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      STACKHOST_DATA_DIR: /app/data
    volumes:
      - stackhost_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  stackhost_data:
